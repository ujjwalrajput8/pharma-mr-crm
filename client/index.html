<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Jovance Laboratories — Field Force</title>
    <script>
      // Same choice ThemeProvider makes, applied before first paint so the
      // loader below (and the app) never flash the wrong theme.
      try {
        var theme = localStorage.getItem('pharma_theme');
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <style>
      /* Shown until React mounts and replaces #root — mirrors BrandLoader. */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f8fafc;
        color: #64748b;
        font: 500 14px 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      /* One 2.4s cycle: the J hops, the L hops, then the whole JL turns once. */
      .boot-mark {
        position: relative;
        width: 112px;
        aspect-ratio: 5 / 3;
        animation: boot-round 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-mark img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: boot-hop-j 2.4s cubic-bezier(0.33, 0, 0.2, 1) infinite;
      }
      .boot-mark img + img { animation-name: boot-hop-l; }
      @keyframes boot-hop-j { 0%, 25%, 100% { transform: translateY(0); } 12.5% { transform: translateY(-16%); } }
      @keyframes boot-hop-l { 0%, 25%, 50%, 100% { transform: translateY(0); } 37.5% { transform: translateY(-16%); } }
      @keyframes boot-round { 0%, 50% { transform: rotate(0deg); } 85%, 100% { transform: rotate(360deg); } }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      html[data-theme='dark'] .boot { background: #070a0f; color: #94a3b8; }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark, .boot-mark img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark" aria-hidden="true">
          <img src="/jovance-j.png" alt="" />
          <img src="/jovance-l.png" alt="" />
        </div>
        <span class="boot-sr">Loading</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
