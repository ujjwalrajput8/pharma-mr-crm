# Render — Pharma MR CRM (server)

services:
  - type: web
    name: pharma-mr-crm-api
    runtime: node
    rootDir: server
    plan: free
    # No SQL migration folders yet (only migration_lock.toml) → use db push.
    # When you add real migrations under prisma/migrations/*/migration.sql,
    # switch preDeployCommand to: npx prisma migrate deploy
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://pharma-mr-crm-1.onrender.com,http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

# Notes:
# - Prisma uses provider "prisma-client-js" → @prisma/client (CommonJS-safe).
# - Do NOT use provider "prisma-client" with output "../generated/prisma"
#   (that emits ESM + import.meta and breaks "type": "commonjs" / npm start).
# - Schema sync today: preDeployCommand = `npx prisma db push`
#   (migrate deploy finds nothing until you create real migration folders).
